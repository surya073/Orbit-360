<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* Apply the saved theme before first paint (no flash). Keep in sync with
         src/config/themes.js (ids) and src/app/providers/ThemeProvider.js (storage key). */
      (function () {
        var theme = 'light', density = 'comfortable';
        try {
          var s = JSON.parse(localStorage.getItem('company360.appearance') || '{}');
          if (['sunset', 'moon', 'beach', 'dark', 'light', 'system'].indexOf(s.theme) > -1) theme = s.theme;
          if (s.density === 'compact') density = 'compact';
        } catch (e) {}
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var r = document.documentElement;
        r.dataset.theme = theme === 'system' ? (dark ? 'dark' : 'light') : theme;
        r.dataset.themePref = theme;
        r.dataset.density = density;
      })();
    </script>
    <meta name="theme-color" content="#1f5fbf" />
    <meta
      name="description"
      content="Company 360 internal analytics and reporting"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Company 360</title>
    <!-- Catalyst Web SDK (auth). init.js is served by Catalyst hosting / "catalyst serve". -->
    <script src="https://static.zohocdn.com/catalyst/sdk/js/4.6.1/catalystWebSDK.js"></script>
    <script src="/__catalyst/sdk/init.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
